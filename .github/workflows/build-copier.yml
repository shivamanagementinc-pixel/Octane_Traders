name: Build Copier (Windows .exe)

on:
  workflow_dispatch: {}
  push:
    paths:
      - "copier/**"
      - ".github/workflows/build-copier.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller MetaTrader5 tzdata requests numpy

      - name: Build exe
        working-directory: copier
        run: pyinstaller --noconfirm --onefile --console --name octane-copier --collect-all MetaTrader5 --collect-all numpy --collect-all tzdata --hidden-import config --hidden-import lot_calculator copier.py

      - name: List build output
        working-directory: copier
        run: Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: Bundle runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path copier/dist | Out-Null
          if (Test-Path copier/copier.ini.example) { Copy-Item copier/copier.ini.example copier/dist/ }
          if (Test-Path copier/config_local.py.example) { Copy-Item copier/config_local.py.example copier/dist/ }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: octane-copier-windows
          path: |
            copier/dist/octane-copier.exe
            copier/dist/*.example
          if-no-files-found: error
